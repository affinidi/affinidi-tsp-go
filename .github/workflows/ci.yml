name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fuzz smoke
        run: |
          go test -run '^$' -fuzz FuzzOpen -fuzztime 20s .
          go test -run '^$' -fuzz FuzzPeek -fuzztime 20s .
